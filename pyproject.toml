[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgsearch"
version = "0.1.0"
description = "Vector indexer and semantic search CLI using EmbeddingGemma 2"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
local = [
    "huggingface-hub",
    "safetensors",
    "sentence-transformers>=6.1.0",
    "torch",
    "transformers>=5.18.0",
]
dev = [
    "pytest",
]

[project.scripts]
imgsearch = "imgsearch:main"

[tool.setuptools]
py-modules = ["imgsearch", "embed_base", "remote_embed", "local_embed"]

[tool.pyink]
pyink = true
pyink-indentation = 2
line-length = 80
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
